name: crawl

on:
  schedule:
    - cron: "13 * * * *"  # バックアップ用に1時間ごと（主役はCloudflare Workerからの30分ごとdispatch起動。00/30分と離してpush衝突を減らす）
  workflow_dispatch: {}

# 多重実行防止（前回が走行中なら新規はキューで待つ。キャンセルはしない）
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 各工程に個別の制限時間を設定（どこで固まってもログ付きで即失敗し、30分後の次回巡回が取り返す）
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 3

      - name: Setup Node 20
        uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: 20

      - name: Install Claude Code CLI
        timeout-minutes: 5
        run: npm install -g @anthropic-ai/claude-code || (sleep 10 && npm install -g @anthropic-ai/claude-code)

      - name: Run crawler
        timeout-minutes: 13
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: timeout --kill-after=15 720 python3 crawl_ci.py

      - name: Commit and push if changed
        timeout-minutes: 3
        run: |
          if git diff --quiet -- municipal.json state/; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add municipal.json state/
            git commit -m "update municipal road data ($(date -u +'%Y-%m-%dT%H:%MZ'))"
            # 同時実行と衝突した場合はrebaseして最大3回やり直す
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $i) — rebase and retry"
              git pull --rebase origin main || exit 1
              sleep 5
            done
          fi
