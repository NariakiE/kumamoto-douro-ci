name: crawl

on:
  schedule:
    - cron: "13,43 * * * *"  # 30分ごと（毎時13分・43分。00/30分ちょうどはGitHub側が混雑し間引かれるため回避）
  workflow_dispatch: {}

# 多重実行防止（前回が走行中なら新規はキューで待つ。キャンセルはしない）
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run crawler
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 crawl_ci.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- municipal.json state/; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add municipal.json state/
            git commit -m "update municipal road data ($(date -u +'%Y-%m-%dT%H:%MZ'))"
            git push
          fi
